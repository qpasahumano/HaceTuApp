<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    >

    <meta
        name="theme-color"
        content="#4a2918"
    >

    <title>Curso Humanómetro · Cursos Hacé tu App</title>

    <link
        rel="stylesheet"
        href="style.css?v=33"
    >

</head>


<body>


<!-- ==================================================
     PANTALLA PREVIA DE ACCESO
     ================================================== -->

<section
    id="pantallaAcceso"
    class="pantalla-acceso"
    aria-label="Acceso al contenido"
>


    <div class="acceso-escena">


        <div class="acceso-pizarron">

            <img
                src="wide_horizontal_png_style_illustration_on_a_transp.png"
                class="acceso-pizarron-imagen"
                alt="Pizarrón"
                draggable="false"
            >

        </div>


        <!-- ==================================================
             ZONA CARTA + IDENTIDAD
             ================================================== -->

        <div class="acceso-carta-zona">


            <div class="acceso-carta">

                <img
                    src="hacetuapp_carta_presentacion.png"
                    class="acceso-carta-imagen"
                    alt="Carta de presentación de hacetuapp.com"
                    draggable="false"
                >

            </div>


            <div class="acceso-identidad" style="width: 70%; max-width: 300px; margin: 15px auto 5px auto; text-align: center;">

                <img
                    src="hacetuapp_logo_blanco.png"
                    class="acceso-logo-hacetuapp"
                    alt="www.hacetuapp.com"
                    style="width: 100%; height: auto; display: block;"
                    draggable="false"
                >

            </div>


        </div>


        <!-- ==================================================
             OPCIONES DE ACCESO
             ================================================== -->

        <div class="acceso-opciones">


            <button
                id="botonYaAcceso"
                class="acceso-opcion acceso-opcion-ingreso"
                type="button"
                aria-label="Ya tenés acceso. Ingresar"
            >

                <span class="tecla-texto">
                    YA TENÉS ACCESO
                    <span class="tecla-texto-secundario">
                        INGRESAR
                    </span>
                </span>

            </button>


            <button
                id="botonNoAcceso"
                class="acceso-opcion acceso-opcion-desbloqueo"
                type="button"
                aria-label="No tenés acceso. Desbloquear conocimientos"
            >

                <span class="tecla-texto">
                    NO TENÉS ACCESO
                    <span class="tecla-texto-secundario">
                        DESBLOQUEAR
                        <span class="tecla-texto-terciario">
                            CONOCIMIENTOS
                        </span>
                    </span>
                </span>

            </button>


        </div>


        <!-- ==================================================
             PANEL DE INGRESO
             ================================================== -->

        <div
            id="panelIngreso"
            class="panel-ingreso"
            aria-hidden="true"
        >

            <div class="panel-ingreso-contenido">


                <label for="usuarioAcceso">
                    USUARIO
                </label>

                <input
                    id="usuarioAcceso"
                    type="text"
                    autocomplete="username"
                    inputmode="email"
                    placeholder="Usuario o correo"
                >


                <label for="claveAcceso">
                    CLAVE
                </label>

                <input
                    id="claveAcceso"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Contraseña"
                >


                <button
                    id="botonConfirmarIngreso"
                    type="button"
                    class="boton-confirmar-ingreso"
                >
                    INGRESAR
                </button>


                <button
                    id="botonCerrarIngreso"
                    type="button"
                    class="boton-cerrar-ingreso"
                >
                    VOLVER
                </button>


                <p
                    id="mensajeIngreso"
                    class="mensaje-ingreso"
                    aria-live="polite"
                ></p>


            </div>

        </div>


    </div>

</section>



<main id="contenidoPrincipal" style="position: relative;">

    <!-- ÚNICO BOTÓN DE SALIR GENERAL LIMPIO Y SIN DUPLICADOS -->
    <button
        class="boton-salir-general"
        type="button"
        onclick="location.reload()"
        aria-label="Salir de la sesión"
        style="position: absolute; top: 12px; right: 15px; z-index: 100; background: rgba(0,0,0,0.75); color: #fff; border: 1px solid rgba(255,255,255,0.7); padding: 5px 10px; border-radius: 5px; font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,0.8);"
    >
        SALIR ⮑
    </button>

    <section class="escena-pupitre">


        <!-- ==================================================
             PIZARRÓN PRINCIPAL
             ================================================== -->

        <div class="zona-pizarron">

            <img
                src="wide_horizontal_png_style_illustration_on_a_transp.png"
                class="pizarron"
                alt="Pizarrón del Curso Humanómetro"
                draggable="false"
            >

        </div>



        <!-- ==================================================
             SALÓN DE ESTUDIO: DUAL COMPUTADORAS RETRO
             ================================================== -->

        <div class="salon-estudio-doble">

            <!-- COMPUTADORA 1: GUÍA DE TRINCHERA -->
            <div class="bloque-curso-retro">
                <div class="computadora-real">
                    <img
                        src="computadora_retro_80_90.png"
                        class="computadora-imagen"
                        alt="Computadora Guía de Trinchera"
                        draggable="false"
                    >
                    <div class="pantalla-youtube" style="background: #050505; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                        <img
                            src="guia_trinchera_4x3_transparente.png"
                            alt="Guía de Trinchera"
                            style="width: 100%; height: 100%; object-fit: contain; pointer-events: none;"
                            draggable="false"
                        >
                    </div>
                </div>

                <div class="papel-descripcion-retro">
                    <h3>Guía de Trinchera</h3>
                    <p>De la idea a una app real, sin saber programar. Un recorrido paso a paso, práctico y simple para crear tu propia app.</p>
                </div>

                <div class="contenedor-boton-curso">
                    <button class="boton-curso-accion fucsia" onclick="abrirPagina(1)" type="button">
                        📖 ENTRAR A LA GUÍA ›
                    </button>
                </div>
            </div>


            <!-- COMPUTADORA 2: BLINDAJE DIGITAL -->
            <div class="bloque-curso-retro">
                <div class="computadora-real">
                    <img
                        src="computadora_retro_80_90.png"
                        class="computadora-imagen"
                        alt="Computadora Blindaje Digital"
                        draggable="false"
                    >
                    <div class="pantalla-youtube" style="background: #050505; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                        <img
                            src="guia_blindaje_4x3_transparente.png"
                            alt="Blindaje Digital"
                            style="width: 100%; height: 100%; object-fit: contain; pointer-events: none;"
                            draggable="false"
                        >
                    </div>
                </div>

                <div class="papel-descripcion-retro">
                    <h3>Blindaje Digital</h3>
                    <p>Protegé tu proyecto y preparalo para generar ingresos. Todo lo que necesitás para publicar, resguardar y hacer crecer tu app.</p>
                </div>

                <div class="contenedor-boton-curso">
                    <button class="boton-curso-accion azul deshabilitado" disabled type="button">
                        ⚙️ INGRESAR A ESTA TEMÁTICA ›
                    </button>
                </div>
            </div>

        </div>



        <!-- ==================================================
             RESPALDO DE SILLA
             ================================================== -->

        <section class="zona-silla" style="margin-top: 35px;">


            <div class="silla-real">


                <img
                    src="respaldo_silla_hacetuapp.png"
                    class="respaldo-silla"
                    alt="Silla de hacetuapp.com"
                    draggable="false"
                >


            </div>


        </section>


    </section>


</main>



<!-- ==================================================
     VISOR DE PÁGINAS (MODAL DEL CURSO SIN CARRUSEL SUPERIOR)
     ================================================== -->

<div
    id="modalPdf"
    class="modal"
    aria-hidden="true"
>


    <div class="modal-contenido">


        <button
            class="cerrar-modal"
            type="button"
            onclick="cerrarModal()"
            aria-label="Cerrar"
        >
            ×
        </button>


        <div class="carpeta-visor">

            <div class="hoja-lectura">

                <img
                    id="paginaVisor"
                    src=""
                    alt="Página del curso"
                    draggable="false"
                >

            </div>


            <section
                class="zona-complementaria"
                aria-label="Contenido complementario de la página"
            >

                <div class="fila-acciones">


                    <button
                        id="botonVideoComplementario"
                        class="boton-video-complementario"
                        type="button"
                        onclick="alternarVideoComplementario()"
                    >
                        ▶ VER VIDEO
                    </button>


                    <button
                        id="accionPagina"
                        class="accion-pagina"
                        type="button"
                        onclick="avanzarPagina()"
                    >
                        SIGUIENTE PÁGINA
                    </button>


                </div>


                <div
                    id="subtituloVideo"
                    class="subtitulo-video"
                    aria-live="polite"
                ></div>


                <div
                    id="contenedorVideoComplementario"
                    class="contenedor-video-complementario"
                    aria-hidden="true"
                >

                    <div class="video-responsive">

                        <iframe
                            id="videoComplementario"
                            title="Video complementario del curso Humanómetro"
                            src=""
                            allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                        </iframe>

                    </div>

                </div>


            </section>


        </div>


    </div>


</div>



<script src="script.js?v=19"></script>


</body>

</html>
